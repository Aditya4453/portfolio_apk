services:
  - type: web
    name: aditya-portfolio-api
    runtime: node
    region: singapore
    plan: free
    # Root is the repo root so we can build the frontend first
    rootDir: .
    buildCommand: "cd client && npm install && npm run build && cd ../server && npm install"
    startCommand: "node server/server.js"
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false   # set manually in Render dashboard
